<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>内容工作台 · 肾域</title>
  <meta name="description" content="肾域内容草稿与审核工作台">
  <meta name="robots" content="noindex,nofollow"/>
  <link rel="icon" href="assets/logo.png"/>
  <link rel="stylesheet" href="styles.css?v=20260914_depth1"/>
</head>
<body>
  <header class="nav"></header>
  <main class="container">
    <section class="hero">
      <div>
        <div class="badge">Editorial workflow</div>
        <h1>内容工作台</h1>
        <p>AI 内容和编辑稿先进入这里。内容编辑可整理并提交审核；只有管理员可以发布。</p>
        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px">
          <a class="btn primary" href="article-editor.html">新建草稿</a>
          <a class="btn" href="articles.html">查看已发布文章</a>
          <a class="btn" id="editorialAdminLink" href="admin.html#articles" hidden>返回管理后台</a>
        </div>
      </div>
    </section>

    <section class="card soft" id="editorialGate">
      <div class="muted small">正在验证内容权限…</div>
    </section>

    <section id="editorialRoot" hidden>
      <div class="grid cols-3" style="margin-top:14px">
        <div class="card soft"><div class="small muted">待审核</div><h2 id="reviewCount">0</h2></div>
        <div class="card soft"><div class="small muted">草稿</div><h2 id="draftCount">0</h2></div>
        <div class="card soft"><div class="small muted">当前身份</div><h3 id="editorialRole">—</h3></div>
      </div>

      <div class="card soft" style="margin-top:14px">
        <div class="section-title">
          <div><h3>草稿与待审内容</h3><p>“AI待审”内容不会出现在公开网站，审核发布后才会展示。</p></div>
          <button class="btn" id="editorialRefresh" type="button">刷新</button>
        </div>
        <div class="tabs" id="editorialFilters" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">
          <button class="btn tiny primary" type="button" data-status="all">全部</button>
          <button class="btn tiny" type="button" data-status="in_review">待审核</button>
          <button class="btn tiny" type="button" data-status="draft">草稿</button>
        </div>
        <div class="stack" id="editorialList" style="margin-top:14px"></div>
      </div>
    </section>
  </main>
  <footer class="footer"></footer>
  <script type="module" src="app.js?v=20260327_001"></script>
  <script type="module" src="editorial.js?v=20260918_daily1"></script>
</body>
</html>
