  <style>
    /* ── Video page specific styles ── */
    .filter-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    .filter-bar .filter-group{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
    .filter-bar .filter-label{font-size:13px;font-weight:600;color:var(--text-muted,#888);white-space:nowrap}
    .filter-bar .sep{width:1px;height:20px;background:var(--border,#333);margin:0 4px}

    .specialty-section{margin-top:24px}
    .specialty-header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
    .specialty-header h3{margin:0;font-size:16px}
    .specialty-header .count{font-size:13px;color:var(--text-muted,#888);margin-left:6px}
    .specialty-header .expand-btn{font-size:13px;cursor:pointer;background:none;border:none;color:var(--accent,#a855f7);padding:4px 8px}
    .specialty-header .expand-btn:hover{text-decoration:underline}

    .video-grid-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}

    /* Access-level badges */
    .badge-free{border-color:rgba(34,197,94,.5);background:rgba(34,197,94,.1);color:#4ade80}
    .badge-member{border-color:rgba(168,85,247,.5);background:rgba(168,85,247,.1);color:#c084fc}
    .badge-training{border-color:rgba(63,131,248,.5);background:rgba(63,131,248,.1);color:#60a5fa}
    .badge-purchased{border-color:rgba(34,197,94,.5);background:rgba(34,197,94,.1);color:#4ade80}
    .badge-source{border-color:rgba(251,191,36,.4);background:rgba(251,191,36,.08);color:#fbbf24;font-size:11px}

    /* Video card */
    .vcard{padding:14px 16px;border-radius:12px;background:var(--card-bg,rgba(255,255,255,.04));border:1px solid var(--border,#222)}
    .vcard .vcard-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;flex-wrap:wrap}
    .vcard h4{margin:0;font-size:14px;font-weight:600;line-height:1.4}
    .vcard .vcard-meta{font-size:12px;color:var(--text-muted,#888);margin-top:4px}
    .vcard .vcard-badges{display:flex;gap:4px;flex-wrap:wrap;flex-shrink:0}
    .vcard .vcard-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

    /* Search box */
    .search-box{padding:8px 12px;border-radius:8px;border:1px solid var(--border,#333);background:var(--input-bg,rgba(255,255,255,.06));color:inherit;font-size:14px;width:100%;max-width:320px}
    .search-box::placeholder{color:var(--text-muted,#666)}

    /* Modal overlay */
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .2s}
    .modal-overlay.active{opacity:1;pointer-events:auto}
    .modal-box{background:var(--bg,#181818);border:1px solid var(--border,#333);border-radius:16px;padding:24px;max-width:420px;width:100%;position:relative}
    .modal-box h3{margin:0 0 8px}
    .modal-box .close-btn{position:absolute;top:12px;right:12px;background:none;border:none;color:var(--text-muted,#888);font-size:20px;cursor:pointer;padding:4px 8px;line-height:1}
    .modal-box .close-btn:hover{color:var(--text,#eee)}
    .modal-box .modal-actions{display:flex;flex-direction:column;gap:10px;margin-top:16px}
    .modal-box .modal-actions a{text-align:center}
  </style>

          <input type="search" id="searchBox" class="search-box" placeholder="搜索课程、主题或讲者…" aria-label="搜索课程、主题或讲者" maxlength="120" enterkeyhint="search" />

<script type="module">
  import { supabase, ensureSupabase, isConfigured, getCurrentUser } from './supabaseClient.js?v=20260401_fix';
  import { VIDEO_CATEGORIES, VIDEO_SOURCES, FREE_VIDEOS } from './assets/videos.js?v=20260917_permissions1';
  import { loadCourseCatalog, buildCourseSeries, courseMediaType, courseMediaIcon, courseAccessLevel, formatCourseDuration } from './course-catalog.js?v=20260916_learn2';
  import { getCourseArtwork } from './course-art.js?v=20260917_visual1';

  // ── State ──
  let DB_VIDEOS = [];
  let ALL_VIDEOS = [...FREE_VIDEOS];
  let _accessSet = new Set();
  let _specialtyBundles = {};
  let _currentUser = null;

  // Filters
  let _filterAccess = 'all';   // all | free | member | training
  let _filterSource = 'all';   // all | glomcon | kidneysphere | external
  let _searchQuery = '';
  let _categoryFilter = 'all';
  let _filterMedia = 'all';
  let _view = 'all';
  let _catalogState = 'loading';
  let _loadingCatalog = false;
  let _catalogAttempt = 0;
  let _visibleLimit = 72;
  const _groupLimits = new Map();
  const _seriesLimits = new Map();
  const _openSeries = new Set();
  let _seriesByCourse = new Map();

  // Specialty expansion state: track which specialties are expanded
  const _expanded = new Set();
  const PREVIEW_COUNT = 4; // show this many per group by default

  // ── URL params ──
  const qs = new URLSearchParams(location.search);
  const _specialtyFilter = qs.get('specialty') || null;
  let _specialtyName = null;

  // Pre-set filters from URL
  if(qs.get('source')) _filterSource = qs.get('source');
  if(qs.get('access')) _filterAccess = qs.get('access');
  if(['audio', 'video'].includes(qs.get('media'))) _filterMedia = qs.get('media');
  if(qs.get('view') === 'series' || qs.get('series')) _view = 'series';
  _searchQuery = (qs.get('q') || '').slice(0, 120).normalize('NFKC').toLocaleLowerCase().trim();
  if (VIDEO_CATEGORIES.some(c => c.key === qs.get('category'))) _categoryFilter = qs.get('category');

  // ── DOM refs ──
  const sections = document.getElementById('videoSections');
  const loginHint = document.getElementById('loginHint');
  const searchBox = document.getElementById('searchBox');
  const accessPills = document.getElementById('accessPills');
  const sourcePills = document.getElementById('sourcePills');
  const mediaPills = document.getElementById('mediaPills');
  const viewPills = document.getElementById('viewPills');
  const catalogStatus = document.getElementById('catalogStatus');
  const catalogRetry = document.getElementById('catalogRetry');
  searchBox.value = (qs.get('q') || '').slice(0, 120);
  const categoryNote = document.getElementById('catalogueCategory');
  if (_categoryFilter !== 'all') {
    categoryNote.hidden = false;
    const label = document.createElement('span');
    label.textContent = `专科：${VIDEO_CATEGORIES.find(c => c.key === _categoryFilter)?.zh || _categoryFilter} `;
    const clear = document.createElement('button');
    clear.type = 'button'; clear.className = 'btn tiny'; clear.textContent = '显示全部专科';
    clear.addEventListener('click', () => { _categoryFilter = 'all'; categoryNote.hidden = true; syncCatalogueQuery(); renderAll(); });
    categoryNote.append(label, clear);
  }
  function syncCatalogueQuery() {
    const url = new URL(location.href);
    const query = searchBox.value.trim();
    if (query) url.searchParams.set('q', query); else url.searchParams.delete('q');
    if (_categoryFilter !== 'all') url.searchParams.set('category', _categoryFilter); else url.searchParams.delete('category');
    for (const [key, value] of [['access', _filterAccess], ['source', _filterSource], ['media', _filterMedia], ['view', _view]]) {
      if(value !== 'all') url.searchParams.set(key, value); else url.searchParams.delete(key);
    }
    if(_view === 'series' && qs.get('series')) url.searchParams.set('series', qs.get('series'));
    else url.searchParams.delete('series');
    history.replaceState(null, '', url.pathname + url.search + url.hash);
  }
  const payModal = document.getElementById('payModal');
  const payModalContent = document.getElementById('payModalContent');

  // ── Helpers ──
  function esc(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function pill(label, active, onClick){
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'pill-btn' + (active ? ' active' : '');
    btn.setAttribute('aria-pressed', String(active));
    btn.textContent = label;
    btn.addEventListener('click', onClick);
    return btn;
  }

  // Display scope is explicit metadata, independent of content source.
  function videoAccessLevel(v){
    return courseAccessLevel(v);
  }

  // Resolve all specialty IDs for a video (new specialty_ids[] takes priority)
  function videoSpecialtyIds(v){
    const arr = Array.isArray(v.specialty_ids) ? v.specialty_ids.filter(Boolean) : [];
    if(arr.length > 0) return arr;
    if(v.specialty_id) return [v.specialty_id];
    const fallback = _categoryToSpecialtyId[v.category];
    return fallback ? [fallback] : [];
  }

  // Check if user has access to a paid video
  function hasVideoAccess(v){
    if(videoAccessLevel(v) === 'free') return true;
    const spIds = Array.isArray(v.specialty_ids) && v.specialty_ids.length ? v.specialty_ids : v.specialty_id ? [v.specialty_id] : [];
    return _accessSet.has(String(v.id))
      || spIds.some(id => _accessSet.has('sp_' + id))
      || (videoAccessLevel(v) === 'member' && _accessSet.has('membership'));
  }

  // Build watch.html URL — SECURITY: never pass source URLs in query params
  function watchUrl(v){
    const u = new URL('watch.html', location.href);
    u.searchParams.set('id', v.id);
    const bvid = v.bvid || '';
    if(bvid) u.searchParams.set('bvid', bvid);
    return u.toString();
  }

  // ── Modal ──
  function showPayModal(v){
    const level = videoAccessLevel(v);
    let html = '';

    if(!_currentUser){
      html = `
        <h3>需要登录</h3>
        <p class="small muted">登录后可购买并学习本课程。</p>
        <div class="modal-actions">
          <a class="btn primary" href="login.html?next=${encodeURIComponent('videos.html')}">登录 / 注册</a>
        </div>`;
    } else if(level === 'member'){
      html = `
        <h3>学术活动视频回放</h3>
        <p class="small muted">¥299/年会员包含周日、周三学术活动视频回放；培训课程需单独付费。已有权益会在播放页核验。</p>
        <div class="modal-actions">
          <a class="btn primary" href="checkout.html?product=MEMBERSHIP-YEARLY">开通教育会员 · ¥299/年</a>
          <a class="btn" href="academy.html#membership">了解会员详情</a>
        </div>`;
    } else if(level === 'training'){
      let btns = '';
      if(v.product_id){
        btns += `<a class="btn primary" href="checkout.html?product_id=${encodeURIComponent(v.product_id)}">购买单集</a>`;
      }
      const spIds = videoSpecialtyIds(v);
      const bundleId = spIds.map(id => _specialtyBundles[id]).find(Boolean);
      if(bundleId){
        btns += `<a class="btn" href="checkout.html?product_id=${encodeURIComponent(bundleId)}">购买整套课</a>`;
      }
      btns += `<a class="btn" href="academy.html#training-projects">查看培训项目</a>`;
      html = `
        <h3>培训课程内容</h3>
        <p class="small muted">本课程为专科培训内容，可通过以下方式解锁学习。</p>
        <div class="modal-actions">${btns}</div>`;
    } else {
      html = `<h3>${level === 'paid' ? '付费内容' : '课程权限待确认'}</h3>
        <p class="small muted">本课程未明确列入年度会员回放范围，请进入播放页核验已有权益与可用的学习方式。</p>
        <div class="modal-actions"><a class="btn primary" href="${esc(watchUrl(v))}">查看课程权限</a>${v.product_id ? `<a class="btn" href="checkout.html?product_id=${encodeURIComponent(v.product_id)}">查看单课详情</a>` : ''}</div>`;
    }

    payModalContent.innerHTML = html;
    payModal.classList.add('active');
  }

  function hidePayModal(){
    payModal.classList.remove('active');
  }
  document.getElementById('payModalClose').addEventListener('click', hidePayModal);
  payModal.addEventListener('click', e => { if(e.target === payModal) hidePayModal(); });

  // ── Filters rendering ──
  function renderFilterPills(){
    const accessOpts = [
      { key: 'all', label: '全部' },
      { key: 'free', label: '免费' },
      { key: 'member', label: '会员' },
      { key: 'training', label: '培训课程' },
      { key: 'paid', label: '其他付费' },
    ];
    accessPills.innerHTML = '';
    accessOpts.forEach(o => {
      accessPills.appendChild(pill(o.label, _filterAccess === o.key, () => {
        _filterAccess = o.key;
        _visibleLimit = 72;
        syncCatalogueQuery();
        renderFilterPills();
        renderAll();
      }));
    });

    const sourceOpts = [
      { key: 'all', label: '全部' },
      ...VIDEO_SOURCES.map(s => ({ key: s.key, label: s.zh })),
    ];
    sourcePills.innerHTML = '';
    sourceOpts.forEach(o => {
      sourcePills.appendChild(pill(o.label, _filterSource === o.key, () => {
        _filterSource = o.key;
        _visibleLimit = 72;
        syncCatalogueQuery();
        renderFilterPills();
        renderAll();
      }));
    });
    mediaPills.replaceChildren(...[['all', '全部'], ['video', '视频'], ['audio', '音频']].map(([key, label]) =>
      pill(label, _filterMedia === key, () => {
        _filterMedia = key; _visibleLimit = 72; syncCatalogueQuery(); renderFilterPills(); renderAll();
      })));
    viewPills.replaceChildren(...[['all', '全部课程'], ['series', '课程系列']].map(([key, label]) =>
      pill(label, _view === key, () => {
        if(key === 'all') qs.delete('series');
        _view = key; _visibleLimit = 72; syncCatalogueQuery(); renderFilterPills(); renderAll();
      })));
  }

  // ── Search ──
  let _searchTimer = null;
  searchBox.addEventListener('input', () => {
    clearTimeout(_searchTimer);
    _searchTimer = setTimeout(() => {
      _searchQuery = searchBox.value.normalize('NFKC').toLocaleLowerCase().trim();
      _visibleLimit = 72;
      syncCatalogueQuery();
      renderAll();
    }, 250);
  });

  // ── Video card ──
  function courseCover(v, extraClass = ''){
    const art = getCourseArtwork(v);
    const media = courseMediaType(v);
    const label = media === 'audio' ? '音频课程' : media === 'video' ? '视频课程' : '专科课程';
    return `<span class="course-cover ${esc(extraClass)} course-art-${esc(art.theme)}"><img src="${esc(art.src)}" data-course-fallback="${esc(art.fallbackSrc)}" alt="${esc(art.alt)}" width="960" height="540" loading="lazy" decoding="async" referrerpolicy="no-referrer"><span class="course-cover-label">${courseMediaIcon(v)}${label}</span></span>`;
  }

  // A moved or unavailable custom cover falls back to the local specialty art.
  sections.addEventListener('error', event => {
    const target = event.target;
    if (target.tagName !== 'IMG') return;
    const fallback = target.getAttribute('data-course-fallback');
    if (!fallback) return;
    if (target.getAttribute('src') !== fallback && !target.hasAttribute('data-course-fallback-tried')) {
      target.setAttribute('data-course-fallback-tried', 'true');
      target.alt = '专科学习主题插画';
      target.src = fallback;
    } else {
      target.removeAttribute('data-course-fallback');
      target.hidden = true;
    }
  }, true);

  function videoCard(v){
    const level = videoAccessLevel(v);
    const access = hasVideoAccess(v);
    const speaker = (v.speaker || '').trim();
    const catMeta = VIDEO_CATEGORIES.find(c => c.key === v.category);
    const catLabel = catMeta ? catMeta.zh : (v.category || '');

    // Badges
    let badgeHtml = '';
    const media = courseMediaType(v);
    let mediaHtml = mediaBadgeHtml(v);
    const duration = formatCourseDuration(v);
    if(duration) mediaHtml += `<span class="badge badge-duration" aria-label="时长 ${esc(duration)}">${esc(duration)}</span>`;
    if(level === 'free'){
      badgeHtml += `<span class="badge badge-free">免费</span>`;
    } else if(level === 'member'){
      badgeHtml += `<span class="badge badge-member">会员</span>`;
    } else if(level === 'training') {
      badgeHtml += `<span class="badge badge-training">培训课程</span>`;
    } else {
      badgeHtml += `<span class="badge badge-unknown">${level === 'paid' ? '付费内容 · 查看权限' : '权限待确认'}</span>`;
    }
    if(access && v.is_paid){
      badgeHtml += `<span class="badge badge-purchased">已有权益</span>`;
    }
    // Source badge for GlomCon
    const srcMeta = VIDEO_SOURCES.find(s => s.key === (v.source || ''));
    if(srcMeta && v.source === 'glomcon'){
      badgeHtml += `<span class="badge badge-source">${esc(srcMeta.zh)}</span>`;
    }

    // Meta line
    const metaParts = [];
    if(speaker) metaParts.push(`主讲：${esc(speaker)}`);
    if(catLabel) metaParts.push(esc(catLabel));
    const metaLine = metaParts.join(' · ');

    // Action: click to watch or show payment modal
    const vid = esc(v.id);
    let actionHtml = '';
    actionHtml = `<a class="btn primary" href="${esc(watchUrl(v))}">${media === 'audio' ? '收听' : media === 'video' ? '观看' : '开始学习'}</a>`;
    if(!access && level !== 'unknown') actionHtml += `<button type="button" class="btn" data-pay-video="${vid}">查看权限</button>`;
    const series = _seriesByCourse.get(String(v.id));
    if(series) actionHtml += `<button class="btn" type="button" data-open-series="${esc(series.id)}">系列目录</button>`;

    return `
      <div class="vcard">
        ${courseCover(v)}
        <div class="vcard-body">
        <div class="vcard-top">
          <div style="min-width:0">
            <h4>${esc(v.title || '')}</h4>
            <div class="vcard-meta">${metaLine}</div>
          </div>
          <div class="vcard-badges"><div class="vcard-media" aria-label="课程形式与时长">${mediaHtml}</div><div class="vcard-access" aria-label="课程权限">${badgeHtml}</div></div>
        </div>
        <div class="vcard-actions">${actionHtml}</div>
        </div>
      </div>`;
  }

  function mediaBadgeHtml(course){
    const media = courseMediaType(course);
    const label = media === 'audio' ? '音频' : media === 'video' ? '视频' : '形式待确认';
    return `<span class="badge badge-media ${media === 'audio' ? 'badge-audio' : media === 'unknown' ? 'badge-unknown' : ''}">${courseMediaIcon(course)}${label}</span>`;
  }

  // ── Grouped rendering by specialty ──
  function getFilteredVideos(){
    let list = [...ALL_VIDEOS];

    // Specialty filter (from URL param, e.g. my-learning)
    if(_specialtyFilter){
      list = list.filter(v => videoSpecialtyIds(v).includes(_specialtyFilter));
    }

    // Access level filter
    if(_filterAccess !== 'all'){
      list = list.filter(v => videoAccessLevel(v) === _filterAccess);
    }

    // Source filter
    if(_filterSource !== 'all'){
      list = list.filter(v => (v.source || 'external') === _filterSource);
    }

    if (_categoryFilter !== 'all') list = list.filter(v => v.category === _categoryFilter);
    if (_filterMedia !== 'all') list = list.filter(v => courseMediaType(v) === _filterMedia);
    // Match homepage search semantics, including multiple terms and specialty labels.
    if(_searchQuery){
      const terms = _searchQuery.split(/\s+/).filter(Boolean);
      list = list.filter(v => {
        const text = [v.title, v.series_title, v.description, v.speaker, VIDEO_CATEGORIES.find(c => c.key === v.category)?.zh,
          VIDEO_SOURCES.find(s => s.key === v.source)?.zh, v.source].join(' ').normalize('NFKC').toLocaleLowerCase();
        return terms.every(term => text.includes(term));
      });
    }

    return list;
  }

  function renderAll(){
    const list = getFilteredVideos();
    const seriesList = buildCourseSeries(ALL_VIDEOS);
    _seriesByCourse = new Map(seriesList.flatMap(series => series.courses.map(course => [String(course.id), series])));

    if(_view === 'series'){
      renderSeries(list, seriesList);
      return;
    }

    if(list.length === 0){
      sections.innerHTML = `<div class="note">${_catalogState === 'complete' ? '没有符合条件的课程。' : '当前已加载的目录中没有符合条件的课程，完整目录仍待加载。'}</div>`;
      return;
    }

    // If specialty filter is active or search is active, show flat list
    if(_specialtyFilter || _searchQuery || _categoryFilter !== 'all'){
      sections.innerHTML = `<div class="video-grid-row">${list.slice(0, _visibleLimit).map(videoCard).join('')}</div>${moreCoursesButton(list.length)}`;
      bindPayButtons();
      return;
    }

    // ── Top-level grouping by content type ──
    const trainingVideos = list.filter(v => videoAccessLevel(v) === 'training');
    const memberVideos = list.filter(v => videoAccessLevel(v) === 'member');
    const freeVideos = list.filter(v => videoAccessLevel(v) === 'free');
    const paidVideos = list.filter(v => videoAccessLevel(v) === 'paid');
    const unknownVideos = list.filter(v => videoAccessLevel(v) === 'unknown');

    const topGroups = [
      { key: 'training', label: '培训课程', sublabel: '系统化专科培训 · 购买后解锁', badge: 'badge-training', videos: trainingVideos },
      { key: 'member', label: '会员学术视频回放', sublabel: '¥299/年 · 周日、周三学术活动视频回放', badge: 'badge-member', videos: memberVideos },
      { key: 'free', label: '免费课程', sublabel: '注册登录后学习', badge: 'badge-free', videos: freeVideos },
      { key: 'paid', label: '其他付费内容', sublabel: '进入课程查看权限，年度会员不自动包含', badge: 'badge-unknown', videos: paidVideos },
      { key: 'unknown', label: '更多课程', sublabel: '权限待确认，进入课程核验已有权益', badge: 'badge-unknown', videos: unknownVideos },
    ];

    let html = '';
    for(const group of topGroups){
      if(group.videos.length === 0) continue;

      // Sub-group by specialty category
      const subGroups = new Map();
      for(const v of group.videos){
        const cat = v.category || 'other';
        if(!subGroups.has(cat)) subGroups.set(cat, []);
        subGroups.get(cat).push(v);
      }

      const catOrder = VIDEO_CATEGORIES.map(c => c.key);
      const sortedSubs = [...subGroups.entries()].sort((a, b) => {
        const ai = catOrder.indexOf(a[0]);
        const bi = catOrder.indexOf(b[0]);
        return (ai === -1 ? 999 : ai) - (bi === -1 ? 999 : bi);
      });

      html += `
        <div class="source-group" style="margin-top:28px">
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:4px">
            <h2 style="margin:0;font-size:18px">${esc(group.label)}</h2>
            <span class="badge ${group.badge}">${group.videos.length} 节${_catalogState === 'complete' ? '' : '（已加载）'}</span>
          </div>
          <div class="small muted" style="margin-bottom:16px">${esc(group.sublabel)}</div>`;

      for(const [catKey, videos] of sortedSubs){
        const catMeta = VIDEO_CATEGORIES.find(c => c.key === catKey);
        const catName = catMeta ? catMeta.zh : catKey;
        const expandKey = group.key + '_' + catKey;
        const isExpanded = _expanded.has(expandKey);
        const groupLimit = _groupLimits.get(expandKey) || 48;
        const showVideos = videos.slice(0, isExpanded ? groupLimit : PREVIEW_COUNT);
        const hasMore = videos.length > PREVIEW_COUNT;

        html += `
          <div class="specialty-section">
            <div class="specialty-header">
              <h3>${esc(catName)}<span class="count">(${videos.length})</span></h3>
              ${hasMore ? `<button class="expand-btn" data-toggle-cat="${esc(expandKey)}">${isExpanded ? '收起' : `展开课程 (${videos.length}) →`}</button>` : ''}
            </div>
            <div class="video-grid-row">
              ${showVideos.map(videoCard).join('')}
            </div>
            ${isExpanded && videos.length > groupLimit ? `<button type="button" class="btn catalog-more" data-more-group="${esc(expandKey)}">再显示 48 节（还有 ${videos.length - groupLimit} 节）</button>` : ''}
          </div>`;
      }

      html += `</div>`;
    }

    sections.innerHTML = html;
    bindPayButtons();
    bindToggleButtons();
  }

  function moreCoursesButton(total){
    return total > _visibleLimit ? `<button type="button" class="btn catalog-more" data-more-courses>再显示 72 项（还有 ${total - _visibleLimit} 项）</button>` : '';
  }

  function renderSeries(list, allSeries){
    const matchingIds = new Set(list.map(row => String(row.id)));
    const seriesList = allSeries.map(series => ({ ...series, matches: series.courses.filter(row => matchingIds.has(String(row.id))) }))
      .filter(series => series.matches.length)
      .sort((a, b) => Number(b.id === qs.get('series')) - Number(a.id === qs.get('series')));
    if(!seriesList.length){
      sections.innerHTML = `<div class="note">${_catalogState === 'complete' ? '当前筛选下暂无已整理的课程系列。可以切换到全部课程继续浏览。' : '当前已加载的课程中暂无符合条件的系列，目录尚未完整加载。'}</div>`;
      return;
    }
    sections.innerHTML = `<p class="small muted">展开系列查看章节。${_catalogState === 'complete' ? '' : '目录加载完成前，章节可能还不完整。'}</p>
      <div class="course-series-grid">${seriesList.slice(0, _visibleLimit).map(series => {
        const speakers = [...new Set(series.matches.map(row => row.speaker).filter(Boolean))];
        const media = [...new Set(series.matches.map(courseMediaType).filter(type => type !== 'unknown'))];
        return `<details class="course-series-card" data-series-id="${esc(series.id)}">
          <summary>${courseCover(series.matches[0], 'course-series-cover')}<span class="course-series-summary"><span class="course-series-heading">${esc(series.title)}</span>
            <span class="course-series-meta">${series.matches.length} 节${series.matches.length < series.courses.length ? '符合筛选' : ''}${_catalogState === 'complete' ? '' : ' · 已加载'}${media.length ? ` · ${media.map(type => type === 'audio' ? '音频' : '视频').join(' / ')}` : ''}</span>
            ${speakers.length ? `<span class="course-series-meta">${esc(speakers.slice(0, 3).join('、'))}${speakers.length > 3 ? ' 等' : ''}</span>` : ''}
            <span class="course-series-toggle">查看章节</span>
          </span></summary><div class="course-series-contents"></div></details>`;
      }).join('')}</div>${moreCoursesButton(seriesList.length)}`;
    sections.querySelectorAll('[data-series-id]').forEach(details => {
      const series = seriesList.find(item => item.id === details.dataset.seriesId);
      const renderContents = () => {
        const limit = _seriesLimits.get(series.id) || 36;
        details.querySelector('.course-series-contents').innerHTML = `<ol class="course-chapter-list">${series.matches.slice(0, limit).map(course => {
          const media = courseMediaType(course), duration = formatCourseDuration(course);
          const action = `<a href="${esc(watchUrl(course))}" aria-label="${media === 'audio' ? '收听' : media === 'video' ? '观看' : '学习'}：${esc(course.title)}">${esc(course.title)}</a>`;
          const level = videoAccessLevel(course);
          const accessLabel = level === 'free' ? '免费' : level === 'member' ? '会员' : level === 'training' ? '培训课程' : level === 'paid' ? '付费内容 · 查看权限' : '权限待确认';
          const meta = [duration, hasVideoAccess(course) ? '' : '进入课程核验权限'].filter(Boolean).join(' · ');
          const chapter = Number(course.chapter_number);
          return `<li${Number.isSafeInteger(chapter) && chapter > 0 ? ` value="${chapter}"` : ''}><div>${action}<div class="course-chapter-badges">${mediaBadgeHtml(course)}<span class="badge badge-${level}">${accessLabel}</span></div>${meta ? `<span class="course-chapter-meta">${esc(meta)}</span>` : ''}</div></li>`;
        }).join('')}</ol>${series.matches.length > limit ? `<button type="button" class="btn catalog-more" data-more-chapters>再显示 36 节</button>` : ''}`;
        details.querySelector('[data-more-chapters]')?.addEventListener('click', () => { _seriesLimits.set(series.id, limit + 36); renderContents(); });
      };
      details.addEventListener('toggle', () => {
        if(details.open){ _openSeries.add(series.id); renderContents(); }
        else { _openSeries.delete(series.id); if(qs.get('series') === series.id) qs.delete('series'); }
      });
      if(qs.get('series') === series.id || _openSeries.has(series.id)) details.open = true;
    });
  }

  // Delegation also covers chapters inserted when a series is expanded.
  sections.addEventListener('click', event => {
    const target = event.target.closest('button');
    if(!target) return;
    if(target.hasAttribute('data-pay-video')){
      const course = ALL_VIDEOS.find(row => String(row.id) === target.dataset.payVideo);
      if(course) showPayModal(course);
    }
    if(target.hasAttribute('data-more-courses')){ _visibleLimit += 72; renderAll(); }
    if(target.hasAttribute('data-more-group')){
      const key = target.dataset.moreGroup;
      _groupLimits.set(key, (_groupLimits.get(key) || 48) + 48); renderAll();
    }
    if(target.hasAttribute('data-open-series')){
      qs.set('series', target.dataset.openSeries); _view = 'series'; syncCatalogueQuery(); renderFilterPills(); renderAll();
      const opened = [...sections.querySelectorAll('[data-series-id]')].find(element => element.dataset.seriesId === target.dataset.openSeries);
      opened?.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }
  });

  // ── Event binding ──
  function bindPayButtons(){
    // Paid course buttons are handled by the delegated listener above.
  }

  function bindToggleButtons(){
    sections.querySelectorAll('[data-toggle-cat]').forEach(btn => {
      btn.addEventListener('click', () => {
        const cat = btn.getAttribute('data-toggle-cat');
        if(_expanded.has(cat)) _expanded.delete(cat);
        else _expanded.add(cat);
        renderAll();
      });
    });
  }

  // ── Login hint ──
  function renderLoginHint(){
    if(!isConfigured() || !supabase){
      loginHint.innerHTML = `<b>提示：</b>当前服务暂不可用（系统初始化中）。`;
      return;
    }
    if(_currentUser){
      loginHint.innerHTML = `已登录：<b>${esc(_currentUser.email || _currentUser.id)}</b>。<a href="my-learning.html">查看我的学习</a>`;
    } else {
      loginHint.innerHTML = `你当前未登录。选择课程后将引导你登录或购买。`;
    }
  }

  // ── Upgrade module ──
  function renderUpgradeModule(){
    const mod = document.getElementById('upgradeModule');
    if(!mod) return;
    const hasPaid = ALL_VIDEOS.some(v => v.is_paid);
    if(!hasPaid){ mod.style.display = 'none'; return; }
    if(_accessSet.size > 0){ mod.style.display = 'none'; return; }
    mod.style.display = 'block';
  }

  // ── Data loading ──
  async function loadUserAccess(){
    if(!_currentUser || !supabase) return;
    try{
      const { data: ents } = await supabase
        .from('user_entitlements')
        .select('entitlement_type, video_id, specialty_id, project_id, end_at, status')
        .eq('user_id', _currentUser.id)
        .eq('status', 'active')
        .in('entitlement_type', ['single_video','specialty_bundle','membership','project_access'])
        .or(`end_at.is.null,end_at.gt.${new Date().toISOString()}`);

      // Collect project_ids that need specialty lookup
      const projectIdsNeedLookup = [];

      for(const e of (ents || [])){
        if(e.entitlement_type === 'single_video' && e.video_id){
          _accessSet.add(String(e.video_id));
        } else if((e.entitlement_type === 'specialty_bundle' || e.entitlement_type === 'project_access') && e.specialty_id){
          _accessSet.add('sp_' + String(e.specialty_id));
        } else if(e.entitlement_type === 'project_access' && !e.specialty_id && e.project_id){
          // project_access without specialty_id — need to look up from products table
          projectIdsNeedLookup.push(e.project_id);
        } else if(e.entitlement_type === 'membership'){
          _accessSet.add('membership');
        }
      }

      // Look up specialty_id from products for project_access entitlements missing it
      if(projectIdsNeedLookup.length){
        try{
          const { data: prods } = await supabase
            .from('products')
            .select('project_id, specialty_id')
            .in('project_id', projectIdsNeedLookup)
            .eq('is_active', true)
            .not('specialty_id', 'is', null);
          for(const p of (prods || [])){
            if(p.specialty_id) _accessSet.add('sp_' + String(p.specialty_id));
          }
        }catch(_e){}
      }
    }catch(err){
      console.warn('loadUserAccess error:', err);
    }
  }

  // Map specialty code → specialty id (for fallback when video has category but no specialty_id)
  let _categoryToSpecialtyId = {};

  async function loadSpecialtyBundles(){
    if(!supabase) return;
    try{
      const { data } = await supabase.from('specialties').select('id, code, bundle_product_id').eq('is_active', true);
      for(const s of (data || [])){
        if(s.bundle_product_id) _specialtyBundles[s.id] = s.bundle_product_id;
        if(s.code) _categoryToSpecialtyId[s.code] = s.id;
      }
    }catch(_e){}
  }

  function updateCatalogStatus(){
    catalogRetry.hidden = _catalogState !== 'error';
    if(_catalogState === 'complete') catalogStatus.textContent = `目录已加载 · ${ALL_VIDEOS.length} 节课程`;
    else if(_catalogState === 'error') catalogStatus.textContent = `目录未加载完整，当前显示 ${ALL_VIDEOS.length} 节。请重新加载后查看完整课程与系列。`;
    else catalogStatus.textContent = `正在加载目录 · 已显示 ${ALL_VIDEOS.length} 节，搜索结果与系列章节可能尚不完整…`;
  }

  function mergeCatalogRows(rows){
    DB_VIDEOS = rows;
    ALL_VIDEOS = [...new Map([...FREE_VIDEOS, ...DB_VIDEOS].map(row => [String(row.id), row])).values()];
  }

  async function loadDbVideos(){
    if(_loadingCatalog) return;
    const attempt = ++_catalogAttempt;
    _loadingCatalog = true;
    _catalogState = 'loading';
    updateCatalogStatus();
    const controller = new AbortController();
    let rejectAborted;
    const aborted = new Promise((_resolve, reject) => { rejectAborted = reject; });
    const onAbort = () => rejectAborted(controller.signal.reason || new Error('课程目录加载超时'));
    controller.signal.addEventListener('abort', onAbort, { once: true });
    let watchdog;
    const keepAlive = () => {
      clearTimeout(watchdog);
      watchdog = setTimeout(() => controller.abort(new Error('课程目录加载超时')), 30000);
    };
    keepAlive();
    try{
      if(!isConfigured()) throw new Error('课程服务暂不可用');
      await Promise.race([ensureSupabase(), aborted]);
      if(!supabase) throw new Error('课程服务暂不可用');
      await Promise.race([loadCourseCatalog(supabase, {
        signal: controller.signal,
        onPage: async (_page, state) => {
          if(controller.signal.aborted || attempt !== _catalogAttempt) throw new Error('课程目录加载已结束');
          keepAlive();
          mergeCatalogRows(state.rows);
          _catalogState = state.complete ? 'complete' : 'loading';
          updateCatalogStatus();
          renderAll();
          renderUpgradeModule();
          // Give mobile interactions a turn between metadata pages.
          await new Promise(resolve => setTimeout(resolve, 0));
        },
      }), aborted]);
    }catch(error){
      if(attempt !== _catalogAttempt) return;
      if(error.partialRows?.length) mergeCatalogRows(error.partialRows);
      _catalogState = 'error';
      updateCatalogStatus();
      renderAll();
    }finally{
      clearTimeout(watchdog);
      controller.signal.removeEventListener('abort', onAbort);
      if(attempt === _catalogAttempt) _loadingCatalog = false;
    }
  }
  catalogRetry.addEventListener('click', loadDbVideos);

  // ── Specialty filter header (from my-learning) ──
  function renderSpecialtyHeader(){
    if(!_specialtyFilter) return;
    const name = _specialtyName || '专科课程';
    const h2 = document.querySelector('.hero h2');
    if(h2) h2.textContent = `${name} · 课程库`;
    document.title = `${name} · 课程库 · 肾域`;
    const badge = document.querySelector('.hero .badge');
    if(badge) badge.textContent = `${name} · 课程库`;
    if(!document.getElementById('specialtyBackLink')){
      const link = document.createElement('div');
      link.id = 'specialtyBackLink';
      link.style.cssText = 'margin-top:8px;';
      link.innerHTML = `<a class="btn tiny" href="videos.html">\u2190 浏览课程库</a>  <a class="btn tiny" href="my-learning.html">返回我的学习</a>`;
      const h2El = document.querySelector('.hero h2');
      if(h2El) h2El.parentNode.insertBefore(link, h2El.nextSibling);
    }
  }

  // ── Init: immediately render static free videos ──
  try{ renderFilterPills(); }catch(e){ console.error('[videos] renderFilterPills error:', e); }
  try{ renderAll(); }catch(e){ console.error('[videos] renderAll error:', e); }

  async function init(){
    // Catalog pages render as they arrive; authentication never delays browsing.
    const catalogWork = loadDbVideos();
    try{
      _currentUser = await getCurrentUser().catch(() => null);
      renderLoginHint();
      await Promise.all([loadUserAccess(), loadSpecialtyBundles()]);
      if(_specialtyFilter && supabase){
        const { data: sp } = await supabase.from('specialties').select('name').eq('id', _specialtyFilter).single();
        if(sp?.name) _specialtyName = sp.name;
        renderSpecialtyHeader();
      }
    }catch(err){
      console.warn('videos init error (non-fatal):', err);
    }
    renderAll();
    renderLoginHint();
    renderUpgradeModule();
    await catalogWork;
  }

  init();
</script>
